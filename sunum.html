<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InVivo Scrubs | Sunum ekranı</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 20 Kasım sahne ekranı ve Instagram hikayesi, tek sayfa iki format */
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px 96px; background: #E9E3DA; }
  .pano {
    position: relative; overflow: hidden; background: var(--krem);
    width: min(100%, calc((100vh - 140px) * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 18px; box-shadow: 0 30px 70px -30px rgba(38, 52, 61, .45);
    display: grid; grid-template-columns: 1.25fr .75fr; align-items: center;
    padding: 6% 7%; gap: 6%;
    container-type: inline-size;
  }
  .pano::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(55% 60% at 88% 30%, rgba(155, 203, 235, .5), transparent 70%);
  }
  .pano > * { position: relative; }
  .pano .logo img { height: 9cqi; }
  .pano .logo { gap: 2.4cqi; }
  .pano .logo .ad { font-size: 6.6cqi; color: var(--gri-428); }
  .pano .logo .alt { font-size: 1.5cqi; color: var(--gri-428); margin-top: .9cqi; }
  .pano h1 { font-size: 4.3cqi; font-weight: 300; margin-top: 5cqi; }
  .pano h1 em { font-style: normal; color: var(--deniz); }
  .pano .alt-yazi { margin-top: 2cqi; font-size: 1.7cqi; color: #4E5B63; }
  .qr-kutu { background: var(--beyaz); border-radius: 2cqi; padding: 2.2cqi; text-align: center; border: 1px solid var(--cizgi); }
  .qr-kutu #qr { width: 100%; aspect-ratio: 1; }
  .qr-kutu #qr img, .qr-kutu #qr canvas { width: 100% !important; height: auto !important; }
  .qr-kutu p { margin-top: 1.4cqi; font: 500 1.6cqi/1.3 var(--govde); }
  .qr-kutu small { display: block; margin-top: .5cqi; font-size: 1.2cqi; color: var(--gri-430); }
  .pano .dalga-alt { position: absolute; left: 0; right: 0; bottom: 0; height: 9%; width: 100%; }

  /* Hikaye formatı 9:16 */
  body.hikaye .pano {
    width: min(100%, calc((100vh - 140px) * 9 / 16)); aspect-ratio: 9 / 16;
    grid-template-columns: 1fr; align-content: center; text-align: center; padding: 12% 10%; gap: 6%;
  }
  body.hikaye .pano .logo { justify-content: center; }
  body.hikaye .pano .logo img { height: 15cqi; }
  body.hikaye .pano .logo .ad { font-size: 11cqi; }
  body.hikaye .pano .logo .alt { font-size: 2.6cqi; }
  body.hikaye .pano h1 { font-size: 8cqi; margin-top: 9cqi; }
  body.hikaye .pano .alt-yazi { font-size: 3.6cqi; }
  body.hikaye .qr-kutu { width: 62%; margin: 0 auto; padding: 4cqi; border-radius: 4cqi; }
  body.hikaye .qr-kutu p { font-size: 3.4cqi; margin-top: 2.6cqi; }
  body.hikaye .qr-kutu small { font-size: 2.6cqi; }

  .kontrol { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: calc(100% - 32px); }
  @media print {
    @page { size: landscape; margin: 0; }
    body { background: none; padding: 0; }
    .kontrol { display: none; }
    .pano { width: 100vw; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <section class="pano" aria-label="InVivo sunum ekranı">
    <div>
      <span class="logo">
        <img src="assets/invivo-isaret.svg" alt="" width="51" height="40">
        <span class="ayrac" aria-hidden="true"></span>
        <span class="yazi"><span class="ad">InVivo</span><span class="alt">SCRUBS</span></span>
      </span>
      <h1>Diş hekimliği için <em>tasarlanan</em> forma.</h1>
      <p class="alt-yazi">Canlının içinde. Kliniğin içinden.</p>
    </div>
    <div class="qr-kutu">
      <div id="qr" role="img" aria-label="Ön sipariş QR kodu"></div>
      <p>İlk seriden ön sipariş ver</p>
      <small>Kameranı tut, ödeme yok, 1 dakika sürer</small>
    </div>
    <svg class="dalga-alt" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#9BCBEB" fill-opacity=".35" d="M0 40 C 180 10 360 70 540 40 S 900 10 1080 40 S 1380 70 1500 40 V90 H0Z"/>
      <path fill="#69B3E7" fill-opacity=".55" d="M0 60 C 200 30 400 85 620 58 S 1000 28 1200 56 S 1440 80 1500 60 V90 H0Z"/>
    </svg>
  </section>

  <div class="kontrol">
    <button class="dugme kucuk" type="button" id="bicim">Hikaye formatı (9:16)</button>
    <button class="dugme acik kucuk" type="button" id="tam">Tam ekran</button>
    <a class="dugme acik kucuk" href="./">Siteye dön</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      // QR kaynağı ayrı ölçülsün diye utm ekli
      var params = new URLSearchParams(location.search);
      var kaynak = params.get("kaynak") || "okul-sunumu";
      var hedef = new URL("./", location.href);
      hedef.searchParams.set("utm_source", kaynak);
      hedef.hash = "siparis";
      new QRCode(document.getElementById("qr"), {
        text: hedef.toString(), width: 512, height: 512,
        colorDark: "#26343D", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M
      });

      var bicim = document.getElementById("bicim");
      function ayarla(hikaye) {
        document.body.classList.toggle("hikaye", hikaye);
        bicim.textContent = hikaye ? "Sahne formatı (16:9)" : "Hikaye formatı (9:16)";
      }
      ayarla(params.get("format") === "hikaye");
      bicim.addEventListener("click", function () { ayarla(!document.body.classList.contains("hikaye")); });
      document.getElementById("tam").addEventListener("click", function () {
        var p = document.querySelector(".pano");
        if (p.requestFullscreen) p.requestFullscreen();
      });
    })();
  </script>
</body>
</html>
